name: Host and portable core verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Mmrliu-gooooood/digital_pen
          ref: 0f8b569176c77dad34aaf83bb008eb118c9f1208
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r software/requirements-host.txt
      - run: python software/verify_host.py --upstream-pc-src upstream-source/digital_pen_ov5640/pc/src

      - name: Isolated offline replay / exact ACK contract
        run: |
          cd verification/offline_ack_crosswire_20261102
          python verify_sources.py
          python test_crosswire_replay.py
          python -O test_crosswire_replay.py

      - name: Mainboard19 source integrity only (not DRC or MCAD)
        run: |
          python verification/mainboard19_20261102/verify_sources.py
          python -O verification/mainboard19_20261102/verify_sources.py

      - name: Mainboard13 source integrity (not DRC/MCAD)
        run: |
          python hardware/mainboard_wip13_20261103/restore_board.py
          python verification/mainboard13_20261103/verify_sources.py
          python -O verification/mainboard13_20261103/verify_sources.py
      - name: Isolated storage handoff finite model
        run: |
          cd verification/storage_handoff_model_20261103
          python test_model.py
          python -O test_model.py
